[project]
name = "ctxlineage"
version = "0.0.1.dev0"
description = "See exactly what context each LLM call consumed - local-first context lineage for LLM apps."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "K.Masuda", email = "me@masukai.dev" }]
dependencies = ["wrapt>=1.16", "click>=8.1", "tiktoken>=0.8"]

[project.scripts]
ctxlineage = "ctxlineage._cli:main"
ctxl = "ctxlineage._cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.22",
  "openai>=1.40",
  "jsonschema>=4.21",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxlineage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
source = ["ctxlineage"]
