[project]
name = "ctxlineage"
version = "0.2.1"
description = "See exactly what context each LLM call consumed - local-first context lineage for LLM apps."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "K.Masuda", email = "me@masukai.dev" }]
keywords = ["llm", "context", "lineage", "observability", "openai", "anthropic", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# tomli only where it is not already stdlib: `ctxlineage test` reads
# ctxlineage.toml, and tomllib landed in 3.11 while we still support 3.10.
# The marker means 3.11+ installs nothing extra and the dep disappears when
# 3.10 is dropped.
dependencies = [
  "wrapt>=1.16",
  "click>=8.1",
  "tiktoken>=0.8",
  "tomli>=2; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/ctxlineage/ctxlineage"
Repository = "https://github.com/ctxlineage/ctxlineage"
Issues = "https://github.com/ctxlineage/ctxlineage/issues"
Changelog = "https://github.com/ctxlineage/ctxlineage/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Upper bound, not a preference: mcp 2.0 removed `mcp.server.fastmcp`, which
# `ctxlineage_mcp.server` imports, so an unbounded range hands a fresh
# `pip install 'ctxlineage[mcp]'` a server that cannot start. Lifted once the
# server is ported to 2.x's `mcp.server.mcpserver.MCPServer` (#114).
mcp = ["mcp>=1.2,<2"]

# Registers the plugin in any suite that has ctxlineage installed; it stays
# inert until --ctxlineage (or the `ctxlineage` ini option) asks for it.
[project.entry-points.pytest11]
ctxlineage = "ctxlineage._pytest_plugin"

[project.scripts]
ctxlineage = "ctxlineage._cli:main"
ctxl = "ctxlineage._cli:main"
ctxlineage-mcp = "ctxlineage_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.22",
  # Upper bound, not a preference: openai 3.0 swapped its transport from httpx
  # to a new `httpx2` package, so respx (which patches httpx.Client) no longer
  # intercepts its requests - every respx-mocked test hits the real API and
  # gets a real 401. openai/anthropic are dev-only (never installed for an
  # end user of ctxlineage itself), so this only protects the test suite, not
  # a shipped package - lifted once the mocking layer is ported (#117).
  "openai>=1.40,<3",
  "jsonschema>=4.21",
  "ruff>=0.8",
  "anthropic>=0.43",
  "langfuse>=4,<5",
  "mcp>=1.2,<2",  # see the extra above
  "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxlineage", "src/ctxlineage_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pin the async-fixture loop scope so pytest-asyncio does not emit its
# "unset default" deprecation warning on every run; "function" is the value
# the suite already relies on (each async test gets a fresh loop).
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
source = ["ctxlineage"]
