[project]
name = "ctxlineage"
version = "0.1.0"
description = "See exactly what context each LLM call consumed - local-first context lineage for LLM apps."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "K.Masuda", email = "me@masukai.dev" }]
keywords = ["llm", "context", "lineage", "observability", "openai", "anthropic", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# tomli only where it is not already stdlib: `ctxlineage test` reads
# ctxlineage.toml, and tomllib landed in 3.11 while we still support 3.10.
# The marker means 3.11+ installs nothing extra and the dep disappears when
# 3.10 is dropped.
dependencies = [
  "wrapt>=1.16",
  "click>=8.1",
  "tiktoken>=0.8",
  "tomli>=2; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/ctxlineage/ctxlineage"
Repository = "https://github.com/ctxlineage/ctxlineage"
Issues = "https://github.com/ctxlineage/ctxlineage/issues"
Changelog = "https://github.com/ctxlineage/ctxlineage/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
ctxlineage = "ctxlineage._cli:main"
ctxl = "ctxlineage._cli:main"
ctxlineage-mcp = "ctxlineage_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.22",
  "openai>=1.40",
  "jsonschema>=4.21",
  "ruff>=0.8",
  "anthropic>=0.43",
  "langfuse>=4,<5",
  "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxlineage", "src/ctxlineage_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
source = ["ctxlineage"]
