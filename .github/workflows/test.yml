name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the latest SDK versions (PLAN.md §12: catch upstream
    # openai/anthropic changes early).
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Package builds
        run: uv build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv sync --upgrade
          else
            uv sync
          fi
      - name: Run tests
        run: uv run pytest -v --cov=ctxlineage --cov-report=term-missing --cov-report=xml
      # Coverage upload only once per matrix (drt pattern); tokenless upload
      # works after the Codecov app is installed on the org (#12) — until then
      # this step is allowed to fail.
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage.xml
