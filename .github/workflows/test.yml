name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the latest SDK versions (PLAN.md §12: catch upstream
    # openai/anthropic changes early).
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Package builds
        run: uv build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv sync --upgrade
          else
            uv sync
          fi
      - name: Run tests
        run: uv run pytest -v --cov=ctxlineage --cov-report=term-missing --cov-report=xml
      # Coverage upload only once per matrix (drt pattern); tokenless upload
      # via the org-installed Codecov app (#12).
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true

  # Isolated so the main matrix never pays for the ~90 MB browser download
  # (#73). One runner, one browser. The tests skip themselves when no browser
  # is present, so this job is the only place they actually run.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run browser tests
        run: uv run pytest tests/browser -v
