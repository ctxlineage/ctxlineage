<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ctxlineage report</title>
<style>
  :root { --ink: #252B33; --teal: #1FBFAE; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; color: var(--ink); }
  h1 { color: var(--ink); } h1 span { color: var(--teal); }
  .note { background: #f0fbfa; border-left: 4px solid var(--teal); padding: .6rem 1rem; }
  table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
  th, td { border: 1px solid #d8dde3; padding: .4rem .6rem; text-align: left;
           font-size: .85rem; vertical-align: top; }
  th { background: var(--ink); color: #fff; }
  .bar { background: #e6eaee; height: 10px; border-radius: 5px; overflow: hidden; }
  .bar > div { background: var(--teal); height: 100%; }
  .err { color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<h1>ctx<span>lineage</span> report</h1>
<p class="note">Placeholder view — the full Call Anatomy UI ships later in M2.</p>
<div id="app"></div>
<script type="application/json" id="ctxlineage-data">{"report_version": 1, "generated_at": "2026-06-12T05:45:44.758764+00:00", "stats": {"sessions": 0, "calls": 0, "errors": 0}, "sessions": []}</script>
<script>
const data = JSON.parse(document.getElementById("ctxlineage-data").textContent);
const el = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let h = `<p>${data.stats.sessions} session(s), ${data.stats.calls} call(s), ` +
        `${data.stats.errors} error(s). Generated ${esc(data.generated_at)}.</p>`;
for (const s of data.sessions) {
  h += `<h2>Session <code>${esc(s.id)}</code></h2>`;
  h += "<table><tr><th>call</th><th>model</th><th>segments (kind: est. tokens)</th>" +
       "<th>usage</th><th>window use</th><th>output</th></tr>";
  for (const c of s.calls) {
    const segs = c.segments.map((g) => `${esc(g.kind)}: ${g.tokens_est}`).join("<br>");
    const used = c.usage ? c.usage.prompt_tokens : c.input_tokens_est;
    const pct = c.context_window ? Math.min(100, 100 * used / c.context_window) : null;
    const bar = pct === null ? "n/a" :
      `<div class="bar"><div style="width:${pct.toFixed(1)}%"></div></div>${pct.toFixed(1)}%`;
    const out = c.error ? `<span class="err">${esc(c.error.type)}</span>` :
      esc((c.output?.content ?? "").slice(0, 120));
    h += `<tr><td>${esc(c.id)}<br><small>${esc(c.timestamp)}</small></td>` +
         `<td>${esc(c.model)}${c.stream ? " (stream)" : ""}</td>` +
         `<td>${segs}</td><td>${c.usage ? c.usage.total_tokens + " total" : "-"}</td>` +
         `<td>${bar}</td><td>${out}</td></tr>`;
  }
  h += "</table>";
}
el.innerHTML = h;
</script>
</body>
</html>
